[env:supermini]
platform = espressif32@6.12.0
board = lolin_s3_mini            ; ESP32-S3 supermini (S3FH4R2)
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; big dual app slots for web OTA
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=4                  ; WS2812B data pin — change to suit wiring
lib_deps =
    fastled/FastLED@^3.9.4
    esp32async/AsyncTCP@^3.3.5
    esp32async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.3.0
